  </head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/85 backdrop-blur-xl"><div class="h-16 px-space-sm flex items-center justify-between"><div class="flex items-center gap-space-xs min-w-0"><button aria-label="Back" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">New Entry</h1></div><div class="flex items-center gap-space-sm shrink-0 pr-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface-container-lowest min-h-screen"><div class="flex flex-col w-full px-space-md pb-space-xl">
<!-- Interactive Amount Display Card -->
<section class="flex flex-col items-center justify-center p-space-lg rounded-xl bg-surface-container mb-space-md text-center shadow-lg relative overflow-hidden">
<!-- Subtle energetic radial backdrop -->
<div class="absolute -top-16 left-1/2 -translate-x-1/2 w-48 h-48 bg-primary-container/10 rounded-full blur-2xl pointer-events-none"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-xs">AMOUNT</span>
<div class="flex items-center justify-center space-x-1 my-space-xs">
<span class="font-headline-lg text-headline-lg text-on-surface select-none font-bold">Rp</span>
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-bold tracking-tight" id="amountDisplay">125,000</span>
<span class="inline-block w-1 h-8 bg-primary rounded-full animate-pulse align-middle ml-1"></span>
</div>
<!-- Quick Pill Adjusters -->
<div class="flex items-center gap-space-xs mt-space-md flex-wrap justify-center z-10">
<button class="h-9 px-space-md rounded-full bg-surface-container-high text-on-surface font-label-md text-label-md active:scale-95 active:bg-secondary-container transition-all" onclick="adjustAmount(10000)" type="button">
        +10k
      </button>
<button class="h-9 px-space-md rounded-full bg-surface-container-high text-on-surface font-label-md text-label-md active:scale-95 active:bg-secondary-container transition-all" onclick="adjustAmount(50000)" type="button">
        +50k
      </button>
<button class="h-9 px-space-md rounded-full bg-surface-container-high text-on-surface font-label-md text-label-md active:scale-95 active:bg-secondary-container transition-all" onclick="adjustAmount(100000)" type="button">
        +100k
      </button>
<button class="h-9 px-space-md rounded-full bg-surface-container-high text-error font-label-md text-label-md active:scale-95 active:bg-error-container transition-all" onclick="clearAmount()" type="button">
        Clear
      </button>
</div>
</section>
<!-- Account Selector Card -->
<section class="flex flex-col p-space-md rounded-xl bg-surface-container mb-space-md shadow-md active:bg-surface-container-high transition-colors cursor-pointer">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-sm">PAID FROM ACCOUNT</span>
<div class="flex items-center justify-between">
<div class="flex items-center space-x-space-md min-w-0">
<div class="w-12 h-12 rounded-xl bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[24px]">account_balance</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface font-semibold truncate">BCA Main Account</span>
<div class="flex items-center space-x-space-xs mt-0.5">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label-md text-label-md text-on-surface-variant truncate">Available: Rp 42,850,000</span>
</div>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[24px] ml-space-xs shrink-0">keyboard_arrow_down</span>
</div>
</section>
<!-- Category Selection -->
<section class="flex flex-col p-space-md rounded-xl bg-surface-container mb-space-md shadow-md">
<div class="flex items-center justify-between mb-space-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">CATEGORY</span>
<span class="font-label-sm text-label-sm text-primary">Swipe to pick</span>
</div>
<div class="flex items-center space-x-space-xs overflow-x-auto pb-space-xs -mx-space-md px-space-md no-scrollbar" id="categoryScroller">
<!-- Dining & Drinks (Active) -->
<button class="category-chip shrink-0 h-10 px-space-md rounded-full bg-primary-container text-on-primary-container flex items-center space-x-space-xs font-label-md text-label-md font-semibold transition-all shadow-sm" onclick="selectCategory(this, 'Dining &amp; Drinks')" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
<span class="material-symbols-outlined text-[18px]">restaurant</span>
<span>Dining &amp; Drinks</span>
</button>
<!-- Groceries -->
<button class="category-chip shrink-0 h-10 px-space-md rounded-full bg-surface-container-low text-on-surface-variant flex items-center space-x-space-xs font-label-md text-label-md hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Groceries')" type="button">
<span class="material-symbols-outlined text-[18px]">shopping_cart</span>
<span>Groceries</span>
</button>
<!-- Transportation -->
<button class="category-chip shrink-0 h-10 px-space-md rounded-full bg-surface-container-low text-on-surface-variant flex items-center space-x-space-xs font-label-md text-label-md hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Transportation')" type="button">
<span class="material-symbols-outlined text-[18px]">directions_subway</span>
<span>Transportation</span>
</button>
<!-- Utilities & Bills -->
<button class="category-chip shrink-0 h-10 px-space-md rounded-full bg-surface-container-low text-on-surface-variant flex items-center space-x-space-xs font-label-md text-label-md hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Utilities &amp; Bills')" type="button">
<span class="material-symbols-outlined text-[18px]">receipt_long</span>
<span>Utilities &amp; Bills</span>
</button>
<!-- Entertainment -->
<button class="category-chip shrink-0 h-10 px-space-md rounded-full bg-surface-container-low text-on-surface-variant flex items-center space-x-space-xs font-label-md text-label-md hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Entertainment')" type="button">
<span class="material-symbols-outlined text-[18px]">movie</span>
<span>Entertainment</span>
</button>
<!-- Custom -->
<button class="shrink-0 h-10 px-space-md rounded-full bg-surface-container-low text-primary flex items-center space-x-space-xs font-label-md text-label-md hover:bg-surface-container-high active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
<span>Custom</span>
</button>
</div>
</section>
<!-- Date & Time Card -->
<section class="flex flex-col p-space-md rounded-xl bg-surface-container mb-space-md shadow-md active:bg-surface-container-high transition-colors cursor-pointer">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-sm">TRANSACTION DATE</span>
<div class="flex items-center justify-between">
<div class="flex items-center space-x-space-md min-w-0">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[22px]">calendar_today</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface truncate">Today, 24 Oct 2024</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">14:30 WIB (Automatic)</span>
</div>
</div>
<div class="flex items-center space-x-space-xs text-primary font-label-md text-label-md">
<span>Edit</span>
<span class="material-symbols-outlined text-[18px]">edit_calendar</span>
</div>
</div>
</section>
<!-- Merchant & Metadata Inputs -->
<section class="flex flex-col p-space-md rounded-xl bg-surface-container mb-space-lg shadow-md space-y-space-md">
<!-- Merchant Field -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-xs" for="merchantInput">PAYEE / STORE</label>
<div class="flex items-center px-space-md py-space-sm rounded-lg bg-surface-container-low focus-within:ring-2 focus-within:ring-primary-container transition-all">
<span class="material-symbols-outlined text-on-surface-variant text-[20px] mr-space-sm">storefront</span>
<input class="w-full bg-transparent border-0 outline-none text-on-surface font-body-md text-body-md placeholder:text-outline" id="merchantInput" placeholder="Merchant (e.g. Kopi Kenangan)" type="text"/>
</div>
</div>
<!-- Note Field -->
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-xs" for="noteInput">NOTES &amp; LABELS</label>
<div class="flex items-start px-space-md py-space-sm rounded-lg bg-surface-container-low focus-within:ring-2 focus-within:ring-primary-container transition-all">
<span class="material-symbols-outlined text-on-surface-variant text-[20px] mr-space-sm mt-0.5">sticky_note_2</span>
<textarea class="w-full bg-transparent border-0 outline-none text-on-surface font-body-md text-body-md placeholder:text-outline resize-none" id="noteInput" placeholder="Add receipt details or project tags..." rows="2"></textarea>
</div>
</div>
<!-- Smart Tags -->
<div class="flex flex-wrap gap-space-xs pt-space-xs">
<button class="tag-chip h-7 px-space-sm rounded-md bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm flex items-center space-x-1 active:scale-95 transition-all" onclick="toggleTag(this)" type="button">
<span>#WorkExpense</span>
</button>
<button class="tag-chip h-7 px-space-sm rounded-md bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm flex items-center space-x-1 active:scale-95 transition-all" onclick="toggleTag(this)" type="button">
<span>#Reimbursable</span>
</button>
<button class="tag-chip h-7 px-space-sm rounded-md bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm flex items-center space-x-1 active:scale-95 transition-all" onclick="toggleTag(this)" type="button">
<span>#TaxDeductible</span>
</button>
</div>
</section>
<!-- Sticky Save Action Button -->
<div class="sticky bottom-4 w-full z-20">
<button class="w-full h-14 rounded-xl bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center justify-center space-x-space-sm shadow-xl active:scale-[0.98] transition-transform" id="saveBtn" onclick="triggerSaveFeedback()" type="button">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span id="saveBtnText">Save Expense (Rp 125,000)</span>
</button>
</div>
</div>
<script>
  let currentAmount = 125000;

  function formatIDR(val) {
    return val.toLocaleString('id-ID');
  }

  function updateDisplays() {
    const formatted = formatIDR(currentAmount);
    document.getElementById('amountDisplay').innerText = formatted;
    document.getElementById('saveBtnText').innerText = `Save Expense (Rp ${formatted})`;
  }

  function adjustAmount(val) {
    currentAmount += val;
    updateDisplays();
  }

  function clearAmount() {
    currentAmount = 0;
    updateDisplays();
  }

  function selectCategory(btn, name) {
    const parent = document.getElementById('categoryScroller');
    const all = parent.querySelectorAll('.category-chip');
    all.forEach(el => {
      el.className = "category-chip shrink-0 h-10 px-space-md rounded-full bg-surface-container-low text-on-surface-variant flex items-center space-x-space-xs font-label-md text-label-md hover:bg-surface-container-high transition-all";
      const checkIcon = el.querySelector('.category-check');
      if (checkIcon) checkIcon.remove();
    });

    btn.className = "category-chip shrink-0 h-10 px-space-md rounded-full bg-primary-container text-on-primary-container flex items-center space-x-space-xs font-label-md text-label-md font-semibold transition-all shadow-sm";
    const checkSpan = document.createElement('span');
    checkSpan.className = "material-symbols-outlined text-[18px] category-check";
    checkSpan.innerText = "check";
    btn.prepend(checkSpan);
  }

  function toggleTag(btn) {
    const isSelected = btn.classList.contains('bg-secondary-container');
    if (isSelected) {
      btn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
      btn.classList.add('bg-surface-container-high', 'text-on-surface-variant');
    } else {
      btn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
      btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
    }
  }

  function triggerSaveFeedback() {
    const btn = document.getElementById('saveBtn');
    const originalText = document.getElementById('saveBtnText').innerText;
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span><span>Persisting to SQLite Room...</span>`;
    setTimeout(() => {
      btn.classList.remove('bg-primary-container', 'text-on-primary-container');
      btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
      btn.innerHTML = `<span class="material-symbols-outlined text-[22px]">task_alt</span><span>Saved Locally!</span>`;
      setTimeout(() => {
        btn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
        btn.classList.add('bg-primary-container', 'text-on-primary-container');
        btn.innerHTML = `<span class="material-symbols-outlined text-[22px]">check_circle</span><span id="saveBtnText">${originalText}</span>`;
        btn.disabled = false;
      }, 1500);
    }, 600);
  }
</script></main><div class="fixed bottom-0 w-full pointer-events-none pb-safe z-50"><div class="w-full flex justify-center py-space-xs"><div class="w-32 h-1 bg-outline-variant/60 rounded-full"></div></div></div></body></html>
