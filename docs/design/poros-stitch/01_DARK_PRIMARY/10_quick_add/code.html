  </head><body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/85 backdrop-blur-xl"><div class="h-16 px-space-sm flex items-center justify-between"><div class="flex items-center gap-space-xs min-w-0"><button aria-label="Back" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">New Entry</h1></div><div class="flex items-center gap-space-sm shrink-0 pr-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface-container-lowest min-h-screen"><div class="flex flex-col w-full px-margin-mobile pb-space-lg select-none">
<!-- Backdrop Simulated Ambient Scrim & Sheet Container -->
<div class="w-full flex flex-col bg-surface-container-low rounded-t-[28px] rounded-b-xl overflow-hidden shadow-2xl relative">
<!-- Tactile Drag Handle Area -->
<div class="w-full flex flex-col items-center pt-3 pb-1 cursor-grab active:cursor-grabbing">
<div class="w-10 h-1 bg-outline-variant/70 rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-space-md pt-2 pb-space-sm flex items-start justify-between">
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-space-xs">
<span class="font-headline-sm text-headline-sm text-on-surface">Quick Add</span>
<span class="inline-flex items-center px-1.5 py-0.5 rounded-full bg-surface-container-highest text-secondary font-label-sm text-label-sm">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary mr-1 animate-pulse"></span>
            Sync Ready
          </span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Offline Room DB • Tap to record instantly</p>
</div>
<button aria-label="Close sheet" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Content Stack -->
<div class="px-space-md flex flex-col gap-space-md pb-space-md">
<!-- Primary Priority Row (3 Prominent Cards) -->
<div class="grid grid-cols-3 gap-space-xs">
<!-- Expense Action -->
<button class="group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-xl bg-secondary-container hover:bg-primary-container/30 active:scale-[0.97] transition-all text-center" type="button">
<div class="w-11 h-11 rounded-full bg-primary flex items-center justify-center text-on-primary mb-2 shadow-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<span class="font-title-md text-title-md text-on-surface leading-tight">Expense</span>
<span class="font-label-sm text-label-sm text-on-secondary-container mt-0.5">Log spend</span>
</button>
<!-- Reminder Action -->
<button class="group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-[0.97] transition-all text-center" type="button">
<div class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center text-error mb-2 shadow-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">notifications_active</span>
</div>
<span class="font-title-md text-title-md text-on-surface leading-tight">Reminder</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">Due alert</span>
</button>
<!-- Event Action -->
<button class="group relative flex flex-col items-center justify-center py-3.5 px-2 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-[0.97] transition-all text-center" type="button">
<div class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center text-tertiary mb-2 shadow-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<span class="font-title-md text-title-md text-on-surface leading-tight">Event</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-0.5">Schedule sync</span>
</button>
</div>
<!-- Secondary Tier (4 Compact Action Tiles) -->
<div class="flex flex-col gap-1.5">
<span class="font-label-sm text-label-sm text-outline px-1 uppercase tracking-wider">Additional Records</span>
<div class="grid grid-cols-2 gap-space-xs">
<!-- Income Card -->
<button class="flex items-center gap-space-sm p-3 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-[0.98] transition-all text-left" type="button">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-tertiary shrink-0">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">trending_up</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-lg text-label-lg text-on-surface truncate">Income</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Cash inflow</span>
</div>
</button>
<!-- Transfer Card -->
<button class="flex items-center gap-space-sm p-3 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-[0.98] transition-all text-left" type="button">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-secondary shrink-0">
<span class="material-symbols-outlined text-[20px]">swap_horiz</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-lg text-label-lg text-on-surface truncate">Transfer</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Accounts</span>
</div>
</button>
<!-- Subscription Card -->
<button class="flex items-center gap-space-sm p-3 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-[0.98] transition-all text-left" type="button">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary-container shrink-0">
<span class="material-symbols-outlined text-[20px]">autorenew</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-lg text-label-lg text-on-surface truncate">Subscription</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Recurring cycle</span>
</div>
</button>
<!-- Library Card -->
<button class="flex items-center gap-space-sm p-3 rounded-xl bg-surface-container hover:bg-surface-container-high active:scale-[0.98] transition-all text-left" type="button">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-tertiary-fixed shrink-0">
<span class="material-symbols-outlined text-[20px]">bookmarks</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-lg text-label-lg text-on-surface truncate">Library</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Media &amp; books</span>
</div>
</button>
</div>
</div>
<!-- Contextual 1-Tap Fast-Path Card -->
<div class="flex flex-col p-3.5 rounded-xl bg-surface-container relative overflow-hidden">
<!-- Ambient Accent Glow -->
<div class="absolute -right-6 -bottom-6 w-24 h-24 bg-primary-container/10 rounded-full blur-2xl pointer-events-none"></div>
<div class="flex items-center justify-between mb-2">
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">bolt</span>
            Recent Frequent Transaction
          </span>
<span class="font-label-sm text-label-sm text-outline-variant">Today, 08:30 AM</span>
</div>
<div class="flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-10 h-10 rounded-xl bg-surface-container-highest flex items-center justify-center text-on-surface shrink-0">
<span class="material-symbols-outlined text-[22px]">local_cafe</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-md text-title-md text-on-surface truncate">Kopi Kenangan Senopati</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Rp 38.000 • BCA Main</span>
</div>
</div>
<button class="shrink-0 h-10 px-3.5 rounded-lg bg-primary hover:bg-primary/90 text-on-primary font-label-lg text-label-lg flex items-center gap-1.5 active:scale-95 transition-all shadow-md" id="fast-log-btn" onclick="triggerFastLog()" type="button">
<span class="material-symbols-outlined text-[18px]" id="fast-log-icon">check</span>
<span id="fast-log-text">1-Tap Log</span>
</button>
</div>
</div>
<!-- Sheet Footer -->
<div class="flex items-center justify-center gap-1.5 pt-1 text-outline">
<span class="material-symbols-outlined text-[15px]">lock</span>
<span class="font-label-sm text-label-sm text-center">AES-256 encrypted local SQLite database • Room persistence</span>
</div>
</div>
</div>
</div>
<script>
  function triggerFastLog() {
    const btn = document.getElementById('fast-log-btn');
    const icon = document.getElementById('fast-log-icon');
    const text = document.getElementById('fast-log-text');
    
    if (!btn || !icon || !text) return;
    
    btn.classList.remove('bg-primary', 'hover:bg-primary/90');
    btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
    icon.textContent = 'done_all';
    text.textContent = 'Saved!';
    
    setTimeout(() => {
      btn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
      btn.classList.add('bg-primary', 'hover:bg-primary/90');
      icon.textContent = 'check';
      text.textContent = '1-Tap Log';
    }, 1800);
  }
</script></main><div class="fixed bottom-0 w-full pointer-events-none pb-safe z-50"><div class="w-full flex justify-center py-space-xs"><div class="w-32 h-1 bg-outline-variant/60 rounded-full"></div></div></div></body></html>
